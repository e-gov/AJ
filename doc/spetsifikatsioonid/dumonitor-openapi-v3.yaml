openapi: 3.1.1
info:
  title: Andmejälgija kasutusteabe teenus
  description: Andmejälgija teenus, mille käest küsib eesti.ee andmekogus toimunud isikuandmete töötluse infot ehk kasutusteavet
  contact:
    email: help@ria.ee
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
  version: 3.0.0-rc.4
tags:
  - name: usage
    description: Andmejälgija kasutusteave
paths:
  /v3/findUsage:
    get:
      tags:
        - usage
      summary: Kasutusteabe küsimine
      description: Andmejälgija kasutusteabe küsimine andmesubjektile kuvamiseks eesti.ee-s
      externalDocs:
        description: Täiendav informatsioon X-Road päiste kohta
        url: https://x-tee.ee/docs/live/xroad/pr-rest_x-road_message_protocol_for_rest.html
      operationId: findUsage
      parameters:
        - name: X-Road-UserId
          in: header
          description: Päringu algataja isikukood peab olema lisatud X-Road päise sisse
          required: true
          schema:
            $ref: '#/components/schemas/PersonCode'
        - name: userCode
          in: query
          description: Andmesubjekti isikukood, kelle kohta tuleks tagastada kasutusteavet. Võib erineda X-Road-UserId päise väärtusest, kui päring on käivitatud esindusõiguse abil.
          required: true
          style: form
          schema:
            $ref: '#/components/schemas/PersonCode'
        - name: processingType
          in: query
          description: |
            Tagastada ainult loetletud andmetöötluse kirjete tüübid:
            * `DATA_REQUEST` - Infosüsteemi poolt algatatud isikuandmete päring (seal hulgas andmete lisamine, muutmine ja kustutamine). AvTS §32(2) lõige 3(3);
            * `DATA_RESPONSE` - Andmekogu vastus sissetulevale isikuandmete päringule. AvTS §32(2) lõige 3(4) ja 3(5);
            * `DATA_PROCESSING` - Teisest andmekogust eelnevalt saadud isikuandmete töötlemise raporteerimine. Kasutatud näiteks siis, kui isikuandmed on töödeldud eelnevalt täidetud infosüsteemi puhvrist. AvTS §32(2) lõige 3(3);
            * `INTERNAL_PROCESSING` - Andmekogusisene andmete töötlemine (andmete allikas 'dataSource' on teenuse osutaja ise). AvTS §32(2) lõige 3(3).

            Üleliigsed X-tee päringud lisavad palju latentsust ja koormust turvaserveritele ning seoses sellega näeb tavapärane kasutusmuster ette, et findUsage tagastab kõik andmetöötluse kirjete tüübid korraga.
            Teenuse loomisel tuleks pöörata tähelepanu kirjete sorteerimisele, et pagineerimine käituks ootuspäraselt.
            Andmejälgija rakendus vaikimisi ei saada 'processingType' parameetrit ning teenus peab vastama kõikide kirjetüüpidega, mis tal on. Kuid teenus ei tohi ignoreerida 'processingType' parameetrit,
            kuna Andmejälgija võib kasutada seda siis, kui lõppkasutaja valib, et tahab näha vaid teatud liiki logikirjeid.
            Juhul, kui on õigustatud põhjused, miks teenus ei suuda tagastada kõiki kirjete tüüpe korraga (näiteks asuvad erinevad logid erinevates süsteemides ning nende kokkuviimine sorteerimiseks on keeruline),
            siis on Andmejälgijaga liidestamisel võimalik leppida kokku, et erinevate kirjetüüpide laadimiseks kasutatakse eraldi X-tee päringuid.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum:
                - DATA_REQUEST
                - DATA_RESPONSE
                - DATA_PROCESSING
                - INTERNAL_PROCESSING
            default:
              - DATA_REQUEST
              - DATA_RESPONSE
              - DATA_PROCESSING
              - INTERNAL_PROCESSING
            examples:
              - [DATA_REQUEST, DATA_RESPONSE, DATA_PROCESSING, INTERNAL_PROCESSING]
        - name: includeBulkProcessing
          in: query
          description: |
            Määrab, kas päring peaks tagastama ka massandmetöötluse logisid (näiteks suured automatiseeritud taustaprotsessid, perioodilised masspäringud jne):
            * `true` - Tagastatakse kõik kirjed, sealhulgas massandmetöötlus;
            * `false` - Massandmetöötluse kirjed jäetakse tulemustest välja, tagastatakse vaid tavapärased logid.
          required: false
          style: form
          explode: false
          schema:
            type: boolean
            default: false
            examples:
              - false
        - name: logSourceSystems
          in: query
          description: |
            Tagastada ainult nende infosüsteemide logikirjed, mille nimi on loetletud (vt välja 'logSourceSystem'). Kasutatakse siis, kui üks findUsage teenus haldab mitme infosüsteemi logisid.

            Üleliigsed X-tee päringud lisavad palju latentsust ja koormust turvaserveritele ning seoses sellega näeb tavapärane kasutusmuster ette, et findUsage tagastab kõikide infosüsteemide kirjed korraga.
            Teenuse loomisel tuleks pöörata tähelepanu kirjete sorteerimisele, et pagineerimine käituks ootuspäraselt.
            Andmejälgija rakendus vaikimisi ei saada 'logSourceSystems' parameetrit ning teenus peab vastama kõikide infosüsteemide kirjetega, mis tal on. Kuid teenus ei tohi ignoreerida 'logSourceSystems' parameetrit,
            kuna Andmejälgija võib kasutada seda siis, kui lõppkasutaja valib, et tahab näha vaid teatud infosüsteemide kirjeid.
            Juhul, kui on õigustatud põhjused, miks teenus ei suuda tagastada kõikide infosüsteemide kirjeid korraga, siis on Andmejälgijaga liidestamisel võimalik leppida kokku,
            et erinevate infosüsteemide laadimiseks kasutatakse eraldi X-tee päringuid.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
            examples:
              - [Terviseportaal, Digilugu]
        - name: periodStart
          in: query
          description: Tagastada andmetöötluse kirjeid alates näidatud ajast. Kui parameeter puudub, tagastada kirjeid alates kõige vanemast.
          required: false
          style: form
          schema:
            type: string
            format: date-time
            examples:
              - '2021-01-31T10:20:30Z'
        - name: periodEnd
          in: query
          description: Tagastada andmetöötluse kirjeid kuni näidatud ajani. Kui parameeter puudub, tagastada kirjeid kuni kõige värskemani.
          required: false
          style: form
          schema:
            type: string
            format: date-time
            examples:
              - '2021-01-31T10:20:30Z'
        - name: limit
          in: query
          description: |
            Tagastada maksimaalselt näidatud arv kasutusteabe kirjeid (vaikimisi tagastatakse maksimaalselt 1000 kirjet).
            Teenus võib tagastada vähem kirjeid, kui parameeter ette näeb, ka siis, kui kirjeid on veel järel. Näiteks kui teenusel on seadistatud väiksem sisemine piirang või kui kirjete kogumise loogika ei võimalda tagastada täpselt küsitud arvu kirjeid.
            Kirjete arv vastuses ei näita, kas tegemist on viimase pakiga. Selle määrab ainult vastuse väli 'nextCursor'.
          required: false
          style: form
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 10000
            default: 1000
            examples:
              - 1000
        - name: cursor
          in: query
          description: |
            Kursor järgmise kirjete paki pärimiseks. Väärtuseks on eelmise vastuse välja 'nextCursor' väärtus muutmata kujul.
            Parameetrit ei saadeta esimese paki pärimisel.
            Kursoriga päringus peavad kõik filtreerivad parameetrid (userCode, processingType, includeBulkProcessing, logSourceSystems, periodStart, periodEnd) olema samad, mis esimeses päringus. Parameetri 'limit' väärtus võib erineda.
            Kursori sisu ja formaat on teenuse osutaja sisemine otsus ning teenuse tarbija ei tohi seda tõlgendada ega muuta.
            Kursor võib sisaldada näiteks järgmise paki algust tähistavat nihet (offset) või viimase tagastatud kirje sorteerimisvõtit (keyset pagination).
            Kui kursor on vigane või aegunud, tagastab teenus vea HTTP koodiga 400 ja veakoodiga `INVALID_CURSOR`. Sel juhul tuleb kirjete pärimist alustada uuesti algusest, ilma 'cursor' parameetrita.
          required: false
          style: form
          schema:
            type: string
            examples:
              - eyJsb2dUaW1lIjoiMjAyMS0wMS0zMVQxMDoyMDozMFoiLCJpZCI6MTIzNDV9
      responses:
        '200':
          description: Edukas päring
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindUsageResponse'
        '400':
          description: Päringu sisu ei vasta nõuetele (sh vigane või aegunud kursor)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCursor:
                  summary: Vigane või aegunud kursor
                  value:
                    code: INVALID_CURSOR
                    message: Kursor on aegunud
        '500':
          description: Päringu täitmisel tekkis viga
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v3/disclose:
    post:
      tags:
        - usage
      summary: Peidetud kirjete avalikustamine
      description: Peidetud kasutusteabe kirjete avalikustamine andmesubjektile kuvamiseks. Ühe päringu kohta saab avalikustada korraga kuni 10000 kirjet. Teenuse rakendamine on valikuline — teenuse tarbija ja teenuse osutaja peavad selle kasutuses eraldi kokku leppima.
      operationId: disclose
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscloseRequest'
      responses:
        '200':
          description: Kirjed edukalt avalikustatud
        '400':
          description: Päringu sisu ei vasta nõuetele
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Näidatud queryId-ga kirjet ei leitud
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Päringu täitmisel tekkis viga
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v3/heartbeat:
    get:
      tags:
        - usage
      summary: Kasutusteabe elutukse
      description: Andmejälgija kasutusteabe elutukse küsimine
      operationId: heartbeat
      responses:
        '200':
          description: Edukas päring
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatResponse'
        '500':
          description: Päringu täitmisel tekkis viga
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    FindUsageResponse:
      type: object
      description: |
        Kirjed tagastatakse pakkidena kursori abil. Järgmise paki pärimiseks korratakse päringut parameetriga 'cursor', mille väärtuseks on vastuse välja 'nextCursor' väärtus.
        Kui väli 'nextCursor' puudub, on null või tühi string, on tegemist viimase pakiga.

        Teenus PEAKS võimaluse korral kontrollima, kas tegemist on viimase pakiga, ning sel juhul jätma 'nextCursor' välja tagastamata. Nii ei pea Andmejälgija tegema üleliigset päringut, mis tagastaks tühja tulemuse.
        Kui vastus ei sisalda ühtegi kirjet, lõpetab Andmejälgija kirjete pärimise ka siis, kui vastuses on 'nextCursor' väärtus.
        Seega ei tohi teenus tagastada tühja pakki, kui kirjeid on veel järel. Seda tuleb arvestada eriti siis, kui teenus filtreerib kirjeid pärast andmebaasist lugemist: kui ükski loetud kirje ei läbinud filtrit, peab teenus jätkama lugemist, kuni leitakse vähemalt üks kirje või kirjed saavad otsa.

        Teenus PEAB tagastama kirjed püsivas järjekorras, mis põhineb unikaalsel võtmel (nt logikirje ID või logTime koos logikirje ID-ga), et pagineerimine ei jätaks kirjeid vahele ega tagastaks neid topelt.
        Sorteerimise välja valib teenuse osutaja. Andmejälgija ei eelda kirjete ajalist järjekorda ning sorteerib kirjed vajadusel ise pärast kõikide pakkide kättesaamist.
      properties:
        nextCursor:
          description: Kursor järgmise kirjete paki pärimiseks (vt päringu parameetrit 'cursor'). Kui väli puudub, on null või tühi string, on tegemist viimase pakiga.
          type:
            - string
            - 'null'
          examples:
            - eyJsb2dUaW1lIjoiMjAyMS0wMS0zMVQxMDoyMDozMFoiLCJpZCI6MTIzNDV9
        dataRequests:
          type:
            - array
            - 'null'
          description: Infosüsteemi poolt algatatud isikuandmete päringud
          items:
            $ref: '#/components/schemas/Usage'
        dataResponses:
          type:
            - array
            - 'null'
          description: Andmekogu vastused sissetulevatele isikuandmete päringutele
          items:
            $ref: '#/components/schemas/Usage'
        dataProcessings:
          type:
            - array
            - 'null'
          description: Teisest andmekogust eelnevalt saadud isikuandmete töötlemise raporteerimised
          items:
            $ref: '#/components/schemas/Usage'
        internalProcessings:
          type:
            - array
            - 'null'
          description: Andmekogusisesed andmete töötlemised
          items:
            $ref: '#/components/schemas/Usage'

    UsageCommon:
      type: object
      required:
        - logTime
        - purpose
      anyOf:
        - required:
            - initiatorOrg
        - required:
            - initiatorPerson
      properties:
        logTime:
          description: Andmetöötluse ajamoment
          type: string
          format: date-time
          examples:
            - '2021-01-31T10:20:30Z'
        purpose:
          description: Menetluse/tegevuse/sündmuse inimmõistetav nimi, mis seletab andmetöötluse põhjust
          type: string
          examples:
            - Isiku ees- ja perenime päring
        logSourceSystem:
          description: |
            Logikirje allika ehk teenuse osutaja infosüsteemi nimi, kust see logikirje pärineb. Välja tuleks täita siis, kui teenus võib tagastada mitme infosüsteemi logikirjeid.
            Väli ei tähista isikuandmete allikat, mis on kirjeldatud väljal 'dataSource'.
            Kui väli puudub, määrab Andmejälgija logikirje allika liidestamise käigus määratud andmete põhjal.
          type:
            - string
            - 'null'
          examples:
            - Terviseportaal
        bulkProcessing:
          description: |
            Tunnus, mis näitab, kas see konkreetne logikirje sündis massandmetöötluse käigus (näiteks suured automatiseeritud taustaprotsessid, perioodilised masspäringud jne):
            * `true` - Kirje on osa massandmetöötlusest;
            * `false`, `null` või kui väli puudub - Tavapärane isikuandmete töötlus.
          type:
            - boolean
            - 'null'
          examples:
            - false
        legalBasis:
          description: Andmetöötluse õiguslik alus
          type:
            - string
            - 'null'
          examples:
            - Tervise infosüsteemi põhimäärus (§nn)
        consentReference:
          description: Andmenõusoleku viide, kui päring oli teostatud nõusoleku alusel
          type:
            - string
            - 'null'
          examples:
            - 3f2a9c14-8b7e-4d2a-9f10-2c5b1e6a7d44
        queryId:
          description: Päringuga seotud ID (näiteks X-tee puhul sõnumi ID), mille abil saab kokku siduda andmevahetuse osapoolte andmetöötluse logid
          type:
            - string
            - 'null'
          examples:
            - a34df1a9-f2cf-459f-b99c-6f0737e6aed6
        queryGroupId:
          description: |
            Identifikaator, mis võimaldab siduda mitu seotud X-tee päringut üheks terviklikuks protsessiks (toimikuks).
            Kui X-tee protokolli välja X-Road-Issue kasutatakse toimikunumbri edastamiseks, sobib see väärtus siia otse, tingimusel et see on piisavalt unikaalne erinevate teenuse tarbijate vahel.
            Vastasel juhul SOOVITATAKSE kasutada UUID väärtust või asutuse koodi eesliitega kujul `asutuskood-toimikunumber`, mis tagab unikaalsuse ka siis, kui sama toimikunumber võib esineda mitme tarbija juures.
          type:
            - string
            - 'null'
          examples:
            - 70000562-toimik-2024-001
            - 3dea4e87-dbb6-4d88-aaef-93d89c1f1625
        hiddenReason:
          description: Inimmõistetav põhjendus, miks kirje oli andmesubjekti eest peidetud (nt viide õigusnormile). Kuvatakse andmesubjektile ainult pärast avalikustamist, st kui hiddenUntil on täidetud ja selle ajahetk on möödunud.
          type:
            - string
            - 'null'
          examples:
            - Jälitustegevuse seadus §15
        hiddenUntil:
          description: Ajamoment, milleni kirje oli andmesubjekti eest peidetud. Pärast seda ajahetke on kirje andmesubjektile nähtav. Kui väli puudub, ei olnud kirjet peidetud. Väli täidetakse kas esialgse X-tee päringu käigus (koos hiddenReason väljaga) või hiljem "disclose" teenuse kaudu.
          type:
            - string
            - 'null'
          format: date-time
          examples:
            - '2030-01-01T00:00:00Z'
        initiatorOrg:
          description: Asutus, kes algatas isikuandmete töötlemise
          oneOf:
            - $ref: '#/components/schemas/Organization'
            - type: 'null'
        initiatorPerson:
          description: Isik, kes algatas isikuandmete töötlemise
          oneOf:
            - $ref: '#/components/schemas/Person'
            - type: 'null'

    Usage:
      allOf:
        - $ref: '#/components/schemas/UsageCommon'
        - type: object
          required:
            - dataSource
          properties:
            dataSource:
              description: |
                Asutus, kellelt isikuandmed pärinevad, ehk isikuandmete allikas:
                * `dataRequests` kirjete puhul - teine asutus (andmekogu), kellelt teenuse osutaja isikuandmeid küsis;
                * `dataResponses` kirjete puhul - teenuse osutaja ise, kes vastas sissetulevale päringule;
                * `dataProcessings` kirjete puhul - teine asutus (andmekogu), kellelt teenuse osutaja isikuandmed varem sai;
                * `internalProcessings` kirjete puhul - teenuse osutaja ise.

                Isikuandmete töötlemise algatanud osapool on kirjeldatud väljadel 'initiatorOrg' ja 'initiatorPerson'.
              $ref: '#/components/schemas/Organization'

    OrganizationCode:
      type: string
      examples:
        - '12345678'

    Organization:
      type: object
      anyOf:
        - required:
            - code
        - required:
            - name
      properties:
        type:
          description: |
            Asutuse tüüp:
            * `GOV` - Eesti avaliku sektori asutused (riigiasutused, kohalikud omavalitsused);
            * `COM` - Eesti äriühingud;
            * `NGO` - Eesti mittetulundusühingud ja sihtasutused;
            * `NEE` - Välismaa asutused või ettevõtted.

            Väli PEAKS olema täidetud, kui asutuse tüüp on teenuse osutajale teada. Välja võib jätta tagastamata peamiselt nende logikirjete puhul, mis on kogutud enne v3 protokolli kasutuselevõttu ning milles asutuse tüübi info puudub.
            Uute logikirjete puhul on asutuse tüüp üldjuhul teada, kuna Andmejälgija laiendus X-tee protokollile nõuab selle edastamist.
          type: string
          examples:
            - GOV
          enum:
            - GOV
            - COM
            - NGO
            - NEE
        code:
          description: Asutuse registrikood. Eesti asutuse puhul Eesti registrikood (8 numbrit), välismaa asutuse (`NEE`) puhul asutuse registrikood tema asukohariigis.
          $ref: '#/components/schemas/OrganizationCode'
        name:
          description: Asutuse nimi
          type: string
          examples:
            - TEHIK
        systemName:
          description: Infosüsteemi nimi
          type: string
          examples:
            - Terviseportaal

    PersonCode:
      type: string
      pattern: '^EE[0-9]{11}$'
      examples:
        - 'EE12345678901'

    Person:
      type: object
      anyOf:
        - required:
            - code
        - required:
            - alternativeCode
        - required:
            - name
      properties:
        code:
          description: Inimese isikukood
          $ref: '#/components/schemas/PersonCode'
        alternativeCode:
          description: |
            Muu isikut identifitseeriv kood: töötõendi number või muu unikaalne isiku identifikaator,
            mille abil päringut sooritanud süsteem suudab koodi tegeliku isikuga seostada;
            samuti välisriigi isiku identifitseerimiskood.
          type: string
          examples:
            - D10001
        name:
          description: Isiku nimi
          type: string
          examples:
            - Eesnimi Perenimi

    HeartbeatResponse:
      type: object
      required:
        - status
      properties:
        status:
          description: Elutukse staatus
          type: string
          examples:
            - OK
          enum:
            - OK
            - FAIL
        message:
          description: Inimloetav elutukse staatuse kirjeldav sõnum
          type: string
          examples:
            - API is ready

    DiscloseItem:
      type: object
      required:
        - queryId
        - hiddenReason
        - hiddenUntil
      properties:
        queryId:
          description: Avalikustamisele kuuluva kasutusteabe kirje ID (X-tee sõnumi ID)
          type: string
          examples:
            - a34df1a9-f2cf-459f-b99c-6f0737e6aed6
        hiddenReason:
          description: Inimmõistetav põhjendus, miks kirje oli andmesubjekti eest peidetud (nt viide õigusnormile)
          type: string
          examples:
            - Jälitustegevuse seadus §15
        hiddenUntil:
          description: Ajamoment, milleni kirje oli andmesubjekti eest peidetud. Pärast seda ajahetke on kirje andmesubjektile nähtav.
          type: string
          format: date-time
          examples:
            - '2030-01-01T00:00:00Z'

    DiscloseRequest:
      type: array
      minItems: 1
      maxItems: 10000
      items:
        $ref: '#/components/schemas/DiscloseItem'

    Error:
      type: object
      required:
        - message
      properties:
        code:
          description: |
            Masinloetav veakood. Standardsed veakoodid:
            * `INVALID_CURSOR` - Parameetri 'cursor' väärtus on vigane või aegunud. Kirjete pärimist tuleb alustada uuesti algusest, ilma 'cursor' parameetrita.
          type: string
          examples:
            - INVALID_CURSOR
        message:
          type: string
